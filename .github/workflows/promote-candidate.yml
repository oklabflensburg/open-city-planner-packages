name: Promote reviewed candidate into Registry v2
on:
  workflow_dispatch:
    inputs:
      module_id:
        type: choice
        options: [statistics, analysis-areas]
        required: true
      version:
        type: string
        required: true
      channel:
        type: choice
        options: [stable, beta, nightly]
        required: true
      approval_pr:
        description: Human-merged Candidate PR
        type: string
        required: true
      candidate_sha256:
        description: SHA-256 of canonical complete reviewed provenance
        type: string
        required: true
      bundle_sha256:
        type: string
        required: true
      expected_channel_revision:
        type: string
        required: true
      idempotency_key:
        description: Unique approved intent key; preserve for exact retry
        type: string
        required: true
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: registry-v2-promotion-${{ inputs.module_id }}
  cancel-in-progress: false
jobs:
  promotion:
    if: github.ref == 'refs/heads/main' && vars.PACKAGES_REGISTRY_WRITER_CUTOVER_ENABLED == 'true'
    # Dedicated trusted runner: retained Artifact Store mount, no source-build jobs.
    runs-on: [self-hosted, registry-promoter]
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.14'
      - name: Install trusted locked Registry tooling
        run: |
          python -m pip install uv==0.12.5
          uv sync --frozen --extra registry-db
      - name: Require configured human environment approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/oklabflensburg/open-city-planner-packages/environments/production \
            --jq '.protection_rules[] | select(.type == "required_reviewers") | .reviewers | length' \
            | python -c 'import sys; assert int(sys.stdin.read().strip()) > 0'
      - name: Publish reviewed bytes and commit Registry data
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGES_REGISTRY_PROMOTION_DATABASE_URL: ${{ secrets.PACKAGES_REGISTRY_PROMOTION_DATABASE_URL }}
          PACKAGES_REGISTRY_WRITER_CUTOVER_ENABLED: ${{ vars.PACKAGES_REGISTRY_WRITER_CUTOVER_ENABLED }}
          ARTIFACT_ROOT: ${{ vars.PACKAGES_REGISTRY_PROMOTION_ARTIFACT_ROOT }}
          MODULE_ID: ${{ inputs.module_id }}
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
          APPROVAL_PR: ${{ inputs.approval_pr }}
          CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
          BUNDLE_SHA256: ${{ inputs.bundle_sha256 }}
          CHANNEL_REVISION: ${{ inputs.expected_channel_revision }}
          IDEMPOTENCY_KEY: ${{ inputs.idempotency_key }}
        run: |
          uv run --extra registry-db python -m web.backend.app.registry_promote \
            --module "$MODULE_ID" --version "$VERSION" --channel "$CHANNEL" \
            --approval-pr "$APPROVAL_PR" --candidate-sha256 "$CANDIDATE_SHA256" \
            --bundle-sha256 "$BUNDLE_SHA256" --expected-channel-revision "$CHANNEL_REVISION" \
            --idempotency-key "$IDEMPOTENCY_KEY" --artifact-root "$ARTIFACT_ROOT" \
            --download-reviewed-artifact --mode production --confirm-production-promotion
