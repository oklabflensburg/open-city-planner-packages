name: Registry

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: registry-${{ github.event_name == 'push' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ansible:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out registry source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install pinned uv
        run: python -m pip install "uv==0.12.5"

      - name: Install locked Ansible and test dependencies
        run: uv sync --frozen

      - name: Run Ansible deployment policy tests
        run: uv run pytest deploy/ansible/tests

      - name: Check Ansible playbook syntax
        working-directory: deploy/ansible
        run: |
          uv run ansible-playbook --syntax-check playbooks/bootstrap.yml
          uv run ansible-playbook --syntax-check playbooks/certificates.yml
          uv run ansible-playbook --syntax-check playbooks/deploy.yml
          uv run ansible-playbook --syntax-check playbooks/cleanup.yml
          uv run ansible-playbook --syntax-check playbooks/publish-artifact.yml

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out registry source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install pinned uv
        run: python -m pip install "uv==0.12.5"

      - name: Install locked development tools
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Validate registry source
        run: uv run python scripts/validate_registry.py

      - name: Enforce published release immutability
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: uv run python scripts/validate_registry.py --base-ref "${BASE_REF}"

      - name: Test
        run: uv run pytest

      - name: Rebuild static deployment artifact
        run: uv run python scripts/build_registry.py --output dist

      - name: Verify committed generated output
        run: git diff --exit-code -- dist

      - name: Check whitespace
        run: git diff --check

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out package explorer source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.22.3"

      - name: Set up pinned pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.22.0
          run_install: false

      - name: Install locked frontend dependencies
        working-directory: web/frontend
        run: pnpm install --frozen-lockfile

      - name: Type-check package explorer
        working-directory: web/frontend
        run: pnpm typecheck

      - name: Test package explorer
        working-directory: web/frontend
        run: pnpm test

      - name: Build package explorer SSR application
        working-directory: web/frontend
        run: pnpm build

  artifact-verification:
    if: github.event_name == 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out registry source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned host Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"

      - name: Install pinned uv
        run: python -m pip install "uv==0.12.5"

      - name: Install locked registry dependencies
        run: uv sync --frozen

      - name: Determine new release artifacts
        id: releases
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: |
          count="$(uv run python scripts/verify_artifacts.py \
            --base-ref "${BASE_REF}" \
            --count-only)"
          echo "count=${count}" >> "${GITHUB_OUTPUT}"

      - name: Read pinned host contract
        if: steps.releases.outputs.count != '0'
        id: host-contract
        run: |
          uv run python - <<'PY' >> "${GITHUB_OUTPUT}"
          from scripts.verify_artifacts import load_host_verifier_contract

          contract = load_host_verifier_contract()
          print(f"repository={contract['OCP_HOST_VERIFIER_REPOSITORY']}")
          print(f"ref={contract['OCP_HOST_VERIFIER_REF']}")
          PY

      - name: Check out pinned Open City Planner verifier
        if: steps.releases.outputs.count != '0'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.host-contract.outputs.repository }}
          ref: ${{ steps.host-contract.outputs.ref }}
          path: _host-verifier
          persist-credentials: false

      - name: Set up pinned host Node.js
        if: steps.releases.outputs.count != '0'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: _host-verifier/.node-version

      - name: Set up pinned host pnpm
        if: steps.releases.outputs.count != '0'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.22.0
          run_install: false

      - name: Install locked host verifier dependencies
        if: steps.releases.outputs.count != '0'
        working-directory: _host-verifier/backend
        run: uv sync --frozen --extra dev --no-editable

      - name: Install locked host frontend verifier dependencies
        if: steps.releases.outputs.count != '0'
        working-directory: _host-verifier/frontend
        run: pnpm install --frozen-lockfile

      - name: Verify new release artifacts
        if: steps.releases.outputs.count != '0'
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: |
          uv run python scripts/verify_artifacts.py \
            --base-ref "${BASE_REF}" \
            --host-verifier-root _host-verifier

      - name: Report empty candidate set
        if: steps.releases.outputs.count == '0'
        run: echo "No new release artifacts to verify."

  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - validate
      - ansible
      - web
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: production
    permissions:
      contents: read
    concurrency:
      group: packages-registry-production
      cancel-in-progress: false
    env:
      PACKAGES_REGISTRY_HOST: ${{ vars.PACKAGES_REGISTRY_HOST }}
      PACKAGES_REGISTRY_REMOTE_USER: ${{ vars.PACKAGES_REGISTRY_REMOTE_USER }}
    steps:
      - name: Check out exact reviewed Registry commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install pinned uv
        run: python -m pip install "uv==0.12.5"

      - name: Install locked deployment dependencies
        run: uv sync --frozen

      - name: Configure pinned Production SSH trust
        shell: bash
        env:
          PACKAGES_REGISTRY_SSH_PRIVATE_KEY: ${{ secrets.PACKAGES_REGISTRY_SSH_PRIVATE_KEY }}
          PACKAGES_REGISTRY_SSH_KNOWN_HOSTS: ${{ secrets.PACKAGES_REGISTRY_SSH_KNOWN_HOSTS }}
        run: |
          test -n "${PACKAGES_REGISTRY_SSH_PRIVATE_KEY}"
          test -n "${PACKAGES_REGISTRY_SSH_KNOWN_HOSTS}"
          [[ "${PACKAGES_REGISTRY_HOST}" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ ]]
          [[ "${PACKAGES_REGISTRY_REMOTE_USER}" =~ ^[a-z_][a-z0-9_-]*$ ]]
          umask 077
          mkdir -p "${HOME}/.ssh"
          printf '%s\n' "${PACKAGES_REGISTRY_SSH_PRIVATE_KEY}" > "${HOME}/.ssh/id_ed25519"
          printf '%s\n' "${PACKAGES_REGISTRY_SSH_KNOWN_HOSTS}" > "${HOME}/.ssh/known_hosts"
          chmod 600 "${HOME}/.ssh/id_ed25519"
          chmod 600 "${HOME}/.ssh/known_hosts"
          ssh-keygen -y -f "${HOME}/.ssh/id_ed25519" >/dev/null
          ssh-keygen -F "${PACKAGES_REGISTRY_HOST}" \
            -f "${HOME}/.ssh/known_hosts" >/dev/null

      - name: Generate ephemeral Production inventory
        shell: bash
        run: |
          umask 077
          printf '%s\n' \
            '[packages_registry]' \
            "${PACKAGES_REGISTRY_HOST}" \
            '' \
            '[packages_registry:vars]' \
            'ansible_python_interpreter=/usr/bin/python3' \
            > deploy/ansible/inventory/production.ini

      - name: Verify pinned SSH connectivity
        run: >-
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes
          "${PACKAGES_REGISTRY_REMOTE_USER}@${PACKAGES_REGISTRY_HOST}" true

      - name: Deploy exact reviewed commit with existing Ansible safety gates
        working-directory: deploy/ansible
        env:
          ANSIBLE_REMOTE_USER: ${{ env.PACKAGES_REGISTRY_REMOTE_USER }}
        run: >-
          uv run ansible-playbook
          -i inventory/production.ini
          playbooks/deploy.yml
          -e "packages_registry_deploy_ref=${GITHUB_SHA}"

      - name: Verify public Production Registry
        run: |
          uv run python - <<'PY'
          import json
          import urllib.request

          url = "https://packages.stadtplaner.oklabflensburg.de/index.json"
          with urllib.request.urlopen(url, timeout=30) as response:
              if response.status != 200:
                  raise SystemExit(f"Production Registry returned HTTP {response.status}")
              content_type = response.headers.get_content_type()
              if content_type != "application/json":
                  raise SystemExit(f"Unexpected Content-Type: {content_type}")
              index = json.load(response)
          if index.get("schema_version") != 1 or not isinstance(index.get("modules"), list):
              raise SystemExit("Production Registry did not return a Registry v1 index")
          print("Production Registry smoke check passed.")
          PY
