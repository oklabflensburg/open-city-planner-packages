[project]
name = "open-city-planner-packages"
version = "0.1.0"
description = "Static package registry, metadata validation and publishing tooling for Open City Planner modules"
requires-python = ">=3.12"
keywords = [
  "open-city-planner",
  "gis",
  "webgis",
  "geospatial",
  "civic-tech",
  "open-data",
  "openstreetmap",
  "module-registry",
  "package-registry",
  "json-schema",
]
dependencies = [
  "fastapi==0.141.1",
  "jsonschema==4.25.1",
  "packaging==26.3",
  "pydantic==2.13.5",
  "uvicorn==0.52.4",
]

[project.urls]
Homepage = "https://packages.stadtplaner.oklabflensburg.de/"
Repository = "https://github.com/oklabflensburg/open-city-planner-packages"
"Open City Planner" = "https://github.com/oklabflensburg/open-city-planner"
"Live application" = "https://stadtplaner.oklabflensburg.de/"

[dependency-groups]
dev = [
  "ansible-core==2.19.12",
  "httpx==0.28.1",
  "pytest==8.4.2",
  "pyyaml==6.0.3",
  "ruff==0.12.11",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests", "web/backend/tests"]
markers = [
  "repository_history: tests that require a Git checkout with repository history",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
