---
packages_registry_repo_url: https://github.com/oklabflensburg/open-city-planner-packages.git
packages_registry_deploy_ref: main

packages_registry_root: /opt/open-city-planner-packages
packages_registry_repo_path: "{{ packages_registry_root }}/repo"
packages_registry_releases_dir: "{{ packages_registry_root }}/releases"
packages_registry_current_path: "{{ packages_registry_root }}/current"
packages_registry_artifact_root: "{{ packages_registry_root }}/artifacts"
packages_registry_uv_venv: "{{ packages_registry_root }}/tools/uv"
packages_registry_uv_cache_dir: "{{ packages_registry_root }}/.uv-cache"
packages_registry_pnpm_store_dir: "{{ packages_registry_root }}/.pnpm-store"
packages_registry_node_version: 22.22.3
packages_registry_node_archive_sha256: 2e5d13569282d016861fae7c8f935e741693c269101a5bebcf761a5376d1f99f
packages_registry_node_root: "{{ packages_registry_root }}/tools/node-v{{ packages_registry_node_version }}-linux-x64"
packages_registry_node_binary: "{{ packages_registry_node_root }}/bin/node"
packages_registry_corepack_binary: "{{ packages_registry_node_root }}/bin/corepack"
packages_registry_pnpm_binary: "{{ packages_registry_node_root }}/bin/pnpm"
packages_registry_pnpm_version: 11.22.0
packages_registry_backend_port: 8100
packages_registry_frontend_port: 3000

packages_registry_service_user: ocp-packages
packages_registry_service_group: ocp-packages
packages_registry_uv_version: 0.12.5
packages_registry_run_tests: true
packages_registry_release_retention: 5
packages_registry_min_release_free_bytes: 536870912

packages_registry_manage_nginx: true
packages_registry_domain: packages.stadtplaner.oklabflensburg.de
packages_registry_certificate_name: packages.stadtplaner.oklabflensburg.de
packages_registry_nginx_site_name: open-city-planner-packages
packages_registry_acme_webroot: /var/www/open-city-planner-packages-acme
packages_registry_run_external_smoke_check: true

packages_registry_manage_certificates: false
packages_registry_certbot_email: ""
