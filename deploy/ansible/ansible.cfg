[defaults]
inventory = inventory/production.example.ini
roles_path = roles
filter_plugins = roles/packages_registry/filter_plugins
host_key_checking = True
retry_files_enabled = False
interpreter_python = auto_silent
stdout_callback = default
nocows = true
timeout = 30
# Module uploads use random mode-0700 directories below the sticky system
# temporary directory. This avoids stale or root-owned ~/.ansible/tmp paths on
# shared deployment accounts.
remote_tmp = /tmp

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
