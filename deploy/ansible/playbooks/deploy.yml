---
- name: Deploy package registry
  hosts: packages_registry
  become: true
  serial: 1
  any_errors_fatal: true
  environment:
    GIT_CONFIG_NOSYSTEM: "1"
    GIT_CONFIG_GLOBAL: /dev/null
    GIT_TERMINAL_PROMPT: "0"
  pre_tasks:
    - name: Inspect existing package registry checkout
      ansible.builtin.stat:
        path: /opt/open-city-planner-packages/repo/.git
      register: packages_registry_existing_git

    - name: Normalize existing package registry origin to public GitHub URL
      ansible.builtin.command:
        argv:
          - git
          - remote
          - set-url
          - origin
          - https://github.com/oklabflensburg/open-city-planner-packages.git
        chdir: /opt/open-city-planner-packages/repo
      become_user: ocp-packages
      changed_when: true
      when: packages_registry_existing_git.stat.isdir | default(false)

    - name: Remove stale local Git authentication settings
      ansible.builtin.command:
        argv:
          - git
          - config
          - --local
          - --unset-all
          - "{{ item }}"
        chdir: /opt/open-city-planner-packages/repo
      become_user: ocp-packages
      loop:
        - http.https://github.com/.extraheader
        - http.extraheader
        - credential.helper
        - credential.username
      register: packages_registry_local_git_auth_cleanup
      changed_when: packages_registry_local_git_auth_cleanup.rc == 0
      failed_when: packages_registry_local_git_auth_cleanup.rc not in [0, 5]
      when: packages_registry_existing_git.stat.isdir | default(false)

  roles:
    - role: packages_registry_runtime
    - role: packages_registry
