---
- name: Deploy package registry with a process-owned maintenance lock
  hosts: packages_registry
  become: true
  serial: 1
  any_errors_fatal: true
  vars:
    maintenance_uv_executable: >-
      {{ packages_registry_uv_venv | default(
         (packages_registry_root | default('/opt/open-city-planner-packages')) ~ '/tools/uv'
      ) }}/bin/uv
  tasks:
    - name: Ensure persistent maintenance lock parent exists
      ansible.builtin.file:
        path: /var/lib/ocp-packages-maintenance
        state: directory
        owner: root
        group: root
        mode: '0700'

    - name: Create private deployment invocation directory
      ansible.builtin.tempfile:
        state: directory
        path: /var/lib/ocp-packages-maintenance
        prefix: deploy-
      register: maintenance_stage

    - name: Stage deployment code and resolved settings
      block:
        - name: Copy the exact controller playbooks and roles
          ansible.builtin.copy:
            src: "{{ item.src }}"
            dest: "{{ maintenance_stage.path }}/{{ item.dest }}"
            mode: preserve
          loop:
            - {src: '../roles/', dest: roles/}
            - {src: deploy_locked.yml, dest: deploy_locked.yml}
            - {src: '../ansible.cfg', dest: ansible.cfg}

        - name: Forward resolved registry settings without SSH credentials
          ansible.builtin.copy:
            content: >-
              {{ vars | dict2items | selectattr('key', 'match', '^packages_registry_')
                 | items2dict | to_nice_json }}
            dest: "{{ maintenance_stage.path }}/settings.json"
            mode: '0600'
          no_log: true

        - name: Prepare pinned local Ansible for this invocation
          ansible.builtin.command:
            argv:
              - "{{ maintenance_uv_executable }}"
              - venv
              - --python
              - /usr/bin/python3
              - "{{ maintenance_stage.path }}/venv"
          changed_when: true

        - name: Install the controller Ansible version in the private runtime
          ansible.builtin.command:
            argv:
              - "{{ maintenance_uv_executable }}"
              - pip
              - install
              - --python
              - "{{ maintenance_stage.path }}/venv/bin/python"
              - ansible-core==2.19.12
          changed_when: true

        # The runner, not a short-lived acquire task, owns the fd throughout
        # local Ansible, including its rescue/rollback tasks. Async survives SSH loss.
        - name: Execute complete deployment under exclusive maintenance lock
          ansible.builtin.command:
            argv:
              - /usr/bin/python3
              - "{{ maintenance_stage.path }}/roles/packages_registry/files/maintenance_lock.py"
              - --run
              - "{{ maintenance_stage.path }}/venv/bin/ansible-playbook"
              - -i
              - localhost,
              - -c
              - local
              - deploy_locked.yml
              - -e
              - '@settings.json'
            chdir: "{{ maintenance_stage.path }}"
          async: 2700
          poll: 5
          changed_when: true
          register: maintenance_result

      # Only a confirmed completed command permits removal. After SSH loss the
      # remote deployment may still be using this private invocation directory.
      always:
        - name: Report local deployment output when available
          ansible.builtin.debug:
            msg: "{{ maintenance_result.stdout_lines | default([]) }}"

        - name: Remove invocation files only after confirmed process completion
          ansible.builtin.file:
            path: "{{ maintenance_stage.path }}"
            state: absent
          when:
            - maintenance_result.finished | default(false) | bool
            - maintenance_result.rc is defined
